<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modern Taekwondo Combat Institution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    background:radial-gradient(circle at 50% 28%,#3a2a05 0%,#120d02 45%,#050505 100%);
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vh,28px);max-width:640px}
  .logo{
    height:clamp(150px,34vh,300px);
    max-width:80vw;object-fit:contain;
    filter:drop-shadow(0 0 22px rgba(255,190,50,.55));
  }
  h1{
    margin:0;
    font-size:clamp(22px,5vw,40px);
    font-weight:700;
    letter-spacing:.04em;
    line-height:1.15;
    background:linear-gradient(#fff2c2,#ffc83d 60%,#c78a00);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  .play{
    display:inline-block;
    text-decoration:none;
    font-weight:700;
    font-size:clamp(20px,4vh,28px);
    color:#1a1200;
    background:linear-gradient(#ffe27a,#ffc928);
    border:4px solid #1a1200;
    border-radius:22px;
    padding:14px 34px;
    box-shadow:0 7px 0 #a87000,0 14px 28px rgba(255,190,50,.35);
    transition:transform .06s, box-shadow .06s;
  }
  .play:active{transform:translateY(5px);box-shadow:0 2px 0 #a87000,0 6px 12px rgba(255,190,50,.3)}
</style>
</head>
