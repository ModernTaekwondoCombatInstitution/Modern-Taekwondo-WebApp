<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#142a85">
<title>Virtual Speed Kicks Challenge | Modern Taekwondo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2250;
    --blue:#2f6bff;
    --yellow:#ffd23f;
    --red:#ff4057;
    --green:#35d07f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    background:#142a85;
  }
  body{background:radial-gradient(circle at 50% 0%,#4a86ff 0%,#2448c9 45%,#142a85 100%)}
  .screen{position:fixed;inset:0}
  .hidden{display:none !important}

  /* ---------- buttons ---------- */
  .btn{
    font-family:inherit;font-weight:700;
    font-size:clamp(20px,3.8vh,30px);
    color:var(--navy);
    background:linear-gradient(#ffe27a,#ffc928);
    border:4px solid var(--navy);
    border-radius:22px;
    padding:12px 22px;
    box-shadow:0 7px 0 var(--navy),0 12px 20px rgba(0,0,0,.3);
    cursor:pointer;
    transition:transform .06s, box-shadow .06s;
    touch-action:manipulation;
    line-height:1.1;
  }
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--navy),0 4px 8px rgba(0,0,0,.3)}
  .btn small{display:block;font-size:.45em;font-weight:500;opacity:.8;margin-top:4px}
  .btn.blue{background:linear-gradient(#86b4ff,#3d78ff);color:#fff}
  .btn.white{background:#fff}
  .btn.pulse{animation:throbBtn .45s ease-in-out infinite}
  @keyframes throbBtn{50%{transform:scale(1.06)}}

  /* ---------- menu ---------- */
  #menu{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(8px,1.8vh,18px);padding:14px 16px;text-align:center;overflow:auto;
  }
  .brandRow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,18px);max-width:96vw}
  .brandRow img{height:clamp(84px,17vh,150px);width:auto;max-width:42vw;object-fit:contain;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
  .brandRow .x{font-weight:700;font-size:clamp(22px,4vh,34px);color:#fff;opacity:.85;text-shadow:0 3px 0 var(--navy)}
  .gameTitle{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;
    font-family:'Lilita One','Fredoka',system-ui,sans-serif;font-weight:400;max-width:96vw;line-height:1}
  .gameTitle .tPre{display:flex;align-items:center;gap:12px;color:var(--yellow);letter-spacing:.38em;text-indent:.38em;
    font-size:clamp(13px,2.4vh,19px);text-shadow:0 2px 0 var(--navy)}
  .gameTitle .tPre::before,.gameTitle .tPre::after{content:"";display:block;width:clamp(22px,8vw,60px);height:3px;border-radius:2px;background:var(--yellow);opacity:.9}
  .gameTitle .tMain{color:#fff;font-size:clamp(34px,min(9.5vh,13.5vw),74px);letter-spacing:.02em;transform:skewX(-6deg);white-space:nowrap;
    text-shadow:3px 0 0 var(--navy),-3px 0 0 var(--navy),0 3px 0 var(--navy),0 -3px 0 var(--navy),
                2px 2px 0 var(--navy),-2px -2px 0 var(--navy),2px -2px 0 var(--navy),-2px 2px 0 var(--navy),
                0 7px 0 var(--navy),0 12px 14px rgba(0,0,0,.35)}
  .gameTitle .tSub{color:#fff;background:linear-gradient(#ff7283,#ff3350);border:3px solid var(--navy);border-radius:12px;
    padding:3px .75em 4px;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
    font-size:clamp(15px,3.3vh,26px);box-shadow:0 4px 0 var(--navy);text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .menuTitle{font-size:clamp(17px,2.8vh,23px);font-weight:600;color:#fff;text-shadow:0 2px 0 var(--navy)}
  .menuBtns{display:flex;flex-direction:column;gap:16px;width:min(440px,92vw)}
  .homeLink{display:flex;align-items:center;justify-content:center;gap:8px;width:min(200px,60vw);text-align:center;color:#fff;font-weight:600;text-decoration:none;font-size:18px;
    padding:8px 14px;border:3px solid rgba(255,255,255,.55);border-radius:16px;background:rgba(255,255,255,.12);margin-top:4px}
  .homeLink:active{background:rgba(255,255,255,.25)}
  @media (orientation:landscape) and (max-height:560px){
    #menu{gap:6px}
    .menuBtns{flex-direction:row;width:min(760px,94vw)}
    .menuBtns .btn{flex:1;padding:8px 16px}
    .brandRow img{height:clamp(56px,22vh,100px)}
    .gameTitle .tMain{font-size:clamp(28px,11vh,50px)}
    .gameTitle{gap:4px}
  }

  /* ---------- game layout ---------- */
  #game{
    display:grid;
    grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"top" "stage" "controls";
  }
  @media (orientation:landscape){
    #game{
      grid-template-columns:minmax(0,1fr) clamp(130px,19vw,200px);
      grid-template-rows:auto minmax(0,1fr);
      grid-template-areas:"top top" "stage controls";
    }
  }
  .top{grid-area:top;padding:calc(6px + env(safe-area-inset-top)) 14px 8px}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hudMid{display:flex;align-items:flex-start;justify-content:center;gap:10px;flex:1;min-width:0}
  .iconBtn{
    flex:0 0 auto;width:46px;height:46px;border-radius:16px;border:3px solid var(--navy);
    background:#fff;color:var(--navy);font-family:inherit;font-size:20px;font-weight:700;
    box-shadow:0 4px 0 var(--navy);cursor:pointer;touch-action:manipulation;
  }
  .pbars{display:inline-flex;gap:5px;align-items:center;justify-content:center}
  .pbars i{display:block;width:6px;height:18px;border-radius:2px;background:var(--navy)}
  .iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
  .timerBox{display:flex;flex-direction:column;align-items:center}
  .timer{
    min-width:84px;text-align:center;
    font-size:clamp(28px,5.4vh,46px);font-weight:700;line-height:1.15;
    background:#fff;color:var(--navy);border:4px solid var(--navy);border-radius:20px;
    padding:0 12px;box-shadow:0 5px 0 var(--navy);
  }
  .timer.low{background:var(--red);color:#fff}
  .timer.panic{animation:throbBtn .5s ease-in-out infinite}
  .modeTag{font-size:12px;font-weight:600;margin-top:6px;text-shadow:0 2px 0 var(--navy)}
  .scoreChip{
    flex:0 0 auto;min-width:clamp(58px,15vw,84px);text-align:center;margin-top:2px;
    font-size:clamp(22px,4.6vh,36px);font-weight:700;line-height:1.2;color:#fff;
    border:3px solid var(--navy);border-radius:16px;padding:0 8px;box-shadow:0 4px 0 var(--navy);
  }
  .scoreChip.g{background:#ff4057}
  .scoreChip.m{background:#2f6bff}
  .scoreChip small{display:block;font-size:10px;font-weight:600;line-height:1;margin:-1px 0 2px;opacity:.95}
  .hudMid .scoreChip.g{order:0}
  .hudMid .timerBox{order:1}
  .hudMid .scoreChip.m{order:2}

  /* grade bar (individual) */
  .gbar{margin:8px 4px 0;position:relative;height:44px}
  .gtrack{
    position:absolute;left:0;right:0;top:0;height:22px;border-radius:999px;overflow:hidden;
    background:#dfe6fb;border:4px solid var(--navy);box-shadow:0 4px 0 var(--navy);
  }
  .gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#8c97bd;border-radius:0 999px 999px 0}
  .gtick{position:absolute;top:0;bottom:0;width:3px;background:var(--navy);transform:translateX(-50%);opacity:.8}
  .glabel{
    position:absolute;top:26px;transform:translateX(-50%);font-size:15px;font-weight:700;line-height:1;
    padding:3px 7px;border-radius:999px;color:#fff;border:2px solid var(--navy);opacity:.5;
    transition:opacity .15s, transform .15s;
  }
  .glabel.first{transform:translateX(0)}
  .glabel.last{transform:translateX(-100%)}
  .glabel.on{opacity:1}
  @media (orientation:landscape) and (max-height:520px){
    .iconBtn{width:38px;height:38px;font-size:17px}
    .pbars i{height:15px;width:5px}
    .timer{font-size:24px;min-width:70px}
    .modeTag{display:none}
    .scoreChip{font-size:22px}
    .gbar{height:38px;margin-top:6px}
    .gtrack{height:16px}
    .glabel{top:20px;font-size:13px}
    .top{padding-bottom:4px}
  }

  .stage{grid-area:stage;display:flex;flex-direction:column;gap:10px;padding:0 14px;min-height:0}
  #lanes{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
  .lane{
    position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;
    border:4px solid var(--navy);box-shadow:0 6px 0 rgba(0,0,0,.28);background:#2a2a6a;
  }
  .lane svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
  .laneLabel{
    position:absolute;top:6px;padding:1px 9px;border-radius:999px;
    font-weight:700;font-size:clamp(10px,1.7vh,13px);color:#fff;border:2px solid var(--navy);
    text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap;
  }
  .laneLabel.left{left:8px}
  .laneLabel.right{right:8px}
  .laneScore{
    position:absolute;top:2px;right:12px;
    font-size:clamp(30px,6vh,54px);font-weight:700;line-height:1.1;color:#fff;
    text-shadow:3px 0 0 var(--navy),-3px 0 0 var(--navy),0 3px 0 var(--navy),0 -3px 0 var(--navy),
                2px 2px 0 var(--navy),-2px -2px 0 var(--navy),2px -2px 0 var(--navy),-2px 2px 0 var(--navy),
                0 5px 0 var(--navy);
    transform-origin:right top;
  }

  /* crowd animation */
  .cb{animation:crowdBob 1s ease-in-out infinite}
  .al{animation:waveL .7s ease-in-out infinite alternate}
  .ar{animation:waveR .7s ease-in-out infinite alternate}
  @keyframes crowdBob{50%{transform:translateY(-5px)}}
  @keyframes waveL{from{transform:rotate(-16deg)}to{transform:rotate(14deg)}}
  @keyframes waveR{from{transform:rotate(16deg)}to{transform:rotate(-14deg)}}
  @media (prefers-reduced-motion:reduce){.cb,.al,.ar{animation:none}}

  /* controls */
  .controls{
    grid-area:controls;display:flex;gap:12px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .controls .swap{flex:0 0 34%;font-size:clamp(18px,3.4vh,28px)}
  .btn.red{background:linear-gradient(#ff7a8a,#ff3350);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
  .kickBtn{flex:1;min-height:clamp(84px,14vh,140px);font-size:clamp(28px,5.4vh,46px);letter-spacing:.06em}
  .kickBtn small{letter-spacing:0;font-size:12px;opacity:.9;text-shadow:none}
  @media (orientation:landscape){
    .controls{flex-direction:column;padding:0 14px 14px 0}
    .controls .swap{flex:0 0 32%}
    .kickBtn{min-height:0}
  }

  /* result extras */
  .card{position:relative}
  .qBtn{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:3px solid var(--navy);background:#fff;color:var(--navy);
    font-family:inherit;font-weight:700;font-size:18px;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--navy);touch-action:manipulation;padding:0}
  .qBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
  .twoStat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
  .box{background:#eef3ff;border:3px solid var(--navy);border-radius:16px;padding:6px 6px 8px}
  .box b{display:block;font-size:clamp(38px,8vh,60px);line-height:1.05}
  .box.sm b{font-size:clamp(28px,5.4vh,40px)}
  .box span{display:block;font-size:15px;font-weight:600;line-height:1.1}
  .box small{display:block;font-size:11px;opacity:.7;line-height:1.1;margin-top:2px}
  .box.red{background:#ffe9ec}.box.red b{color:#e0243e}
  .box.blue{background:#e8f0ff}.box.blue b{color:#1f55e0}
  .diaRow{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 2px;font-size:clamp(30px,5.6vh,44px);font-weight:700;line-height:1}
  .diaRow svg{flex:0 0 auto}
  .gemCtr{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:45;display:flex;align-items:center;gap:6px;
    background:#fff;border:3px solid var(--navy);border-radius:999px;padding:3px 14px 3px 8px;font-weight:700;font-size:20px;color:var(--navy);box-shadow:0 3px 0 var(--navy)}
  .gemFly{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:22px;height:22px}
  .faceWrap{width:clamp(64px,12vh,104px);height:clamp(64px,12vh,104px);margin:2px auto 0}
  .faceWrap.win{animation:faceHop .7s ease-in-out infinite}
  .faceWrap.lose{animation:faceSway 1.6s ease-in-out infinite}
  @keyframes faceHop{50%{transform:translateY(-7px) rotate(-4deg)}}
  @keyframes faceSway{50%{transform:rotate(5deg)}}
  .tear{animation:tear 1.2s ease-in infinite;transform-box:fill-box}
  .tear.t2{animation-delay:-.6s}
  @keyframes tear{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(10px);opacity:0}}
  .banner{display:inline-block;margin:4px 0 2px;padding:3px 22px 5px;border:4px solid var(--navy);border-radius:16px;color:#fff;font-weight:700;
    font-size:clamp(22px,4.2vh,34px);line-height:1.1;box-shadow:0 5px 0 var(--navy);
    text-shadow:2px 0 0 var(--navy),-2px 0 0 var(--navy),0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 2px 0 var(--navy),-2px -2px 0 var(--navy),2px -2px 0 var(--navy),-2px 2px 0 var(--navy)}
  .banner.win{background:linear-gradient(#ffd54a,#f0a800)}
  .banner.lose{background:linear-gradient(#7b93e6,#4d62b8)}
  .banner.draw{background:linear-gradient(#aab4d8,#7c88b4)}
  .vsBar{position:relative;height:30px;border:4px solid var(--navy);border-radius:999px;overflow:hidden;background:#dfe6fb;display:flex;margin-top:8px}
  .vsBar i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .vsBar .r{background:linear-gradient(#ff7a8a,#ff3350)}
  .vsBar .b{background:linear-gradient(#6f9dff,#2f6bff)}
  .vsBar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--navy);opacity:.55;transform:translateX(-50%)}
  .vsNums{display:flex;justify-content:space-between;font-weight:700;font-size:16px;margin:4px 4px 0}
  .vsNums .l{color:#e0243e}.vsNums .rr{color:#1f55e0}
  .confetti{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:conf 2.6s linear forwards}
  @keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
  @media (orientation:landscape) and (max-height:520px){
    .card{padding:8px 14px 12px}
    .card h2{font-size:22px;margin:0}
    .gradeBig{font-size:50px}
    .faceWrap{width:52px;height:52px}
    .banner{font-size:20px;padding:1px 16px 3px;margin:0}
    .vsBar{height:22px;margin-top:4px}
    .box{padding:2px 6px 3px}
    .box b{font-size:30px}.box.sm b{font-size:22px}
    .box span{font-size:12px}.box small{display:none}
    .twoStat{margin:4px 0 0;gap:8px}
    .vsNums{font-size:13px;margin-top:2px}
    .diaRow{font-size:22px;margin:2px 0 0}
    .diaRow svg{width:28px;height:28px}
    .row{margin-top:6px}
    .row .btn{padding:6px 18px;font-size:18px}
    .faceWrap{width:44px;height:44px}
    .banner{font-size:18px}
    .card p{margin:2px 0}
  }

  /* tutorial spotlight */
  .tut{position:fixed;inset:0;z-index:40}
  .tutHole{position:absolute;border-radius:18px;border:3px solid var(--yellow);box-shadow:0 0 0 200vmax rgba(10,18,60,.8);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
  .tutTip{position:absolute;background:#fff;color:var(--navy);border:4px solid var(--navy);border-radius:20px;padding:10px 14px 10px;box-shadow:0 6px 0 var(--navy);text-align:center}
  .tutTxt{font-weight:700;font-size:clamp(19px,3vh,24px);line-height:1.2}
  .tutRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;font-weight:600;opacity:.85}
  .tutSkip{font-family:inherit;font-weight:700;font-size:14px;color:var(--navy);background:#e8eeff;border:2px solid var(--navy);border-radius:999px;padding:3px 12px;cursor:pointer}

  /* overlays */
  .overlay{
    position:absolute;inset:0;z-index:20;padding:16px;overflow:auto;
    background:rgba(10,20,70,.66);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
  }
  .card{
    background:#fff;color:var(--navy);width:min(520px,100%);
    border:5px solid var(--navy);border-radius:28px;padding:16px 18px 20px;
    box-shadow:0 10px 0 var(--navy),0 20px 40px rgba(0,0,0,.4);
    text-align:center;max-height:100%;overflow:auto;
  }
  .card h2{margin:0 0 4px;font-size:clamp(24px,4.6vh,36px)}
  .card p{margin:6px 0;font-size:clamp(15px,2.5vh,19px);line-height:1.35}
  .gradeList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
  .gradeList span{
    padding:3px 10px;border-radius:999px;border:3px solid var(--navy);color:#fff;font-weight:700;font-size:15px;
    text-shadow:0 1px 0 rgba(0,0,0,.35);
  }
  .gradeBig{font-size:clamp(64px,13vh,110px);font-weight:700;line-height:1;margin:2px 0;text-shadow:0 5px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy)}
  .resultBig{font-size:clamp(28px,5.5vh,42px);font-weight:700;line-height:1.1;margin:4px 0}
  .newBest{color:#e0359a;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
  .stat{background:#eef3ff;border:3px solid var(--navy);border-radius:16px;padding:8px 6px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{font-size:12px;opacity:.75;line-height:1.2;display:block}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .row .btn{font-size:clamp(18px,3.2vh,24px);padding:10px 22px}
  .row.col{flex-direction:column;align-items:stretch}

  /* big 3-2-1 / TIME text: always fits the screen */
  .countdown{
    position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;
    pointer-events:none;font-weight:700;color:var(--yellow);text-align:center;
    font-size:clamp(44px,min(20vh,22vw),150px);line-height:1;padding:0 10px;
    text-shadow:4px 0 0 var(--navy),-4px 0 0 var(--navy),0 4px 0 var(--navy),0 -4px 0 var(--navy),
                3px 3px 0 var(--navy),-3px -3px 0 var(--navy),3px -3px 0 var(--navy),-3px 3px 0 var(--navy),
                0 8px 0 var(--navy);
  }
  .countdown span{display:block;max-width:100%;animation:pop .5s ease-out}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
</style>
</head>
<body>

<!-- ================= MENU ================= -->
<section id="menu" class="screen">
  <div class="brandRow"><img id="imgModern" alt="Modern Taekwondo"><span class="x">&times;</span><img id="imgSK" alt="Speed Kicks Challenge"></div>
  <h1 class="gameTitle"><span class="tPre">VIRTUAL</span><span class="tMain">SPEED KICKS</span><span class="tSub">Challenge</span></h1>
  <div class="menuTitle">Choose your series</div>
  <div class="menuBtns">
    <button class="btn" id="btnIndividual">Individual<small>20 seconds · earn your grade</small></button>
    <button class="btn blue" id="btnTeam">Team Series<small>2 fighters · stamina · beat the ghost team</small></button>
  </div>
  <a class="homeLink" href="index.html"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen hidden">

/* ===== MODEL START (game rules, no drawing) ===== */
class IndividualModel {
  constructor(cfg) {
    this.cfg = cfg;
    this.kicks = 0;
    this.pressed = 0;
    this.ignored = 0;
    this.lastAccepted = -1e9;
  }
  tap(now) {
    this.pressed++;
    if (now - this.lastAccepted < 1000 / this.cfg.MAX_TAPS_PER_SEC) { this.ignored++; return false; }
    this.lastAccepted = now;
    this.kicks++;
    return true;
  }
}

class TeamModel {
  constructor(cfg) {
    this.cfg = cfg;
    this.t = cfg.TEAM;
    this.stamina = [1, 1];
    this.kicks = [0, 0];
    this.ring = 0;               // which fighter is in the ring
    this.swaps = 0;
    this.pressed = 0;
    this.ignored = 0;
    this.lastTapAny = -1e9;
    this.lastAccepted = -1e9;
    this.lastKick = -1e9;
    this.swapUntil = -1e9;
    this.tapTimes = [];
    this.credit = 0;
  }
  get total() { return this.kicks[0] + this.kicks[1]; }
  // Smooth speed limit: full speed in the green zone, then a smooth glide down to the minimum.
  allowedRate(s) {
    const t = this.t;
    if (s >= t.GREEN_AT) return t.MAX_KICKS_PER_SEC;
    const u = Math.max(0, s) / t.GREEN_AT;
    const sm = u * u * (3 - 2 * u);
    return t.MIN_KICKS_PER_SEC + (t.MAX_KICKS_PER_SEC - t.MIN_KICKS_PER_SEC) * Math.pow(sm, t.CURVE);
  }
  kicksForTapRate(r) {
    const t = this.t;
    return r <= t.ONE_TO_ONE_UNTIL ? r : t.ONE_TO_ONE_UNTIL + (r - t.ONE_TO_ONE_UNTIL) * t.EXTRA_KICK_PER_TAP;
  }
  tap(now) {
    this.pressed++;
    if (now < this.swapUntil) { this.ignored++; return false; }
    this.lastTapAny = now;
    if (now - this.lastAccepted < 1000 / this.cfg.MAX_TAPS_PER_SEC) { this.ignored++; return false; }
    this.lastAccepted = now;
    const w = this.t.TAP_WINDOW_MS;
    this.tapTimes.push(now);
    while (this.tapTimes.length && now - this.tapTimes[0] >= w) this.tapTimes.shift();
    const r = this.tapTimes.length * 1000 / w;           // your tapping speed (taps per second)
    const k = this.kicksForTapRate(r);                  // kicks per second that speed earns
    this.credit = Math.min(1.5, this.credit + Math.min(1, k / r));
    const cap = this.allowedRate(this.stamina[this.ring]);
    if (this.credit >= 0.999 && now - this.lastKick >= 1000 / cap * 0.97) {
      this.credit -= 1;
      this.lastKick = now;
      this.kicks[this.ring]++;
      return true;
    }
    this.ignored++;
    return false;
  }
  swap(now) {
    if (now < this.swapUntil) return false;
    this.ring = 1 - this.ring;
    this.swapUntil = now + this.t.SWAP_MS;
    this.swaps++;
    return true;
  }
  update(now, dt) {
    const trying = (now - this.lastTapAny) < this.t.ACTIVE_WINDOW_MS && now >= this.swapUntil;
    for (let i = 0; i < 2; i++) {
      const d = (i === this.ring && trying) ? -this.t.DRAIN_PER_SEC : this.t.REFILL_PER_SEC;
      this.stamina[i] = Math.max(0, Math.min(1, this.stamina[i] + d * dt));
    }
  }
}

class GhostBot {
  constructor(model, tapsPerSec, onKick) {
    this.m = model;
    this.rate = tapsPerSec;
    this.onKick = onKick;
    this.next = 1e18;
    this.threshold = 0.4;
  }
  start(now) { this.next = now + 250; }
  shift(ms) { if (this.next < 1e17) this.next += ms; }
  interval() { return (1000 / this.rate) * (0.75 + Math.random() * 0.5); }
  update(now) {
    const m = this.m;
    if (now >= m.swapUntil) {
      const r = m.ring;
      if (m.stamina[r] < this.threshold && m.stamina[1 - r] > this.threshold + 0.1) {
        if (m.swap(now)) this.threshold = 0.3 + Math.random() * 0.25;
      }
    }
    if (now - this.next > 500) this.next = now;
    while (this.next <= now) {
      const ring = m.ring;
      if (m.tap(this.next) && this.onKick) this.onKick(ring, this.next);
      this.next += this.interval();
    }
  }
}

function pulse(u) { return (u <= 0 || u >= 1) ? 0 : Math.sin(Math.PI * Math.pow(u, 0.62)); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

// kick tempo allowed by a stamina value (same curve as TeamModel.allowedRate)
function rateFor(s) {
  const t = CONFIG.TEAM;
  if (s >= t.GREEN_AT) return t.MAX_KICKS_PER_SEC;
  const u = Math.max(0, s) / t.GREEN_AT, sm = u * u * (3 - 2 * u);
  return t.MIN_KICKS_PER_SEC + (t.MAX_KICKS_PER_SEC - t.MIN_KICKS_PER_SEC) * Math.pow(sm, t.CURVE);
}
/* Shuffle kick, one leg over a 2-beat loop. [beat, thigh angle, shin angle]  (degrees, 0 = hanging down, + = forward)
   0 chamber (knee up) -> 0.3 kick lands on the pad -> 0.6 foot comes back -> 1.0-1.3 plants as the back leg
   -> 1.5 heel flicks up behind -> 1.75 swings forward -> 2.0 chamber again. The other leg runs one beat later. */
const LEG_KF = [[0, 60, 0], [0.3, 78, 86], [0.6, 14, 8], [1.0, -6, 3], [1.3, -12, 2], [1.5, -4, -28], [1.75, 26, -10], [2.0, 60, 0]];
function legKF(s, c, tuck) {
  const n = LEG_KF.length - 1;                       // last knot repeats the first
  const P = [];
  for (let i = 0; i < n; i++) {
    const k = LEG_KF[i];
    let a1 = k[1], a2 = k[2];
    if (i === 0) { a1 *= c; a2 *= c; }               // chamber fades out when the fighter is idle
    if (i === 1) { a1 = 6 + (a1 - 6) * (0.45 + 0.55 * c); }
    if (i === 4) a2 = 2 - 26 * tuck;                 // standing leg folds up while both feet are in the air
    if (i === 5 || i === 6) a2 *= tuck;              // heel flick / leg exchange only when not tired
    P.push([k[0], a1, a2]);
  }
  s = ((s % 2) + 2) % 2;
  let i = 0;
  while (i < n - 1 && s >= P[i + 1][0]) i++;
  const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
  const t0 = p1[0], t1 = (i + 1 < n) ? p2[0] : 2;
  const h = t1 - t0, u = (s - t0) / h;
  const tm0 = i === 0 ? p1[0] - 2 + 2 : 0; // (unused, keeps indices readable)
  const dt0 = (p2[0] + (i + 1 >= n ? 2 : 0)) - (p0[0] - (i === 0 ? 2 : 0));
  const dt1 = (p3[0] + (i + 2 >= n ? 2 : 0)) - p1[0];
  const u2 = u * u, u3 = u2 * u;
  const h00 = 2 * u3 - 3 * u2 + 1, h10 = u3 - 2 * u2 + u, h01 = -2 * u3 + 3 * u2, h11 = u3 - u2;
  const out = [];
  for (let j = 1; j <= 2; j++) {
    const m0 = (p2[j] - p0[j]) / dt0 * h, m1 = (p3[j] - p1[j]) / dt1 * h;
    out.push(h00 * p1[j] + h10 * m0 + h01 * p2[j] + h11 * m1);
  }
  return out;
}

function mkLimb(parent, w, color) {
  const common = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
  const o = el('polyline', Object.assign({ stroke: NAVY, 'stroke-width': w + 7 }, common), parent);
  const f = el('polyline', Object.assign({ stroke: color, 'stroke-width': w }, common), parent);
  return {
    set(pts) {
      const s = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      o.setAttribute('points', s);
      f.setAttribute('points', s);
    }
  };
}
function mkFoot(parent) {
  const g = el('g', null, parent);
  el('ellipse', { cx: 7, cy: 3, rx: 16, ry: 10, fill: NAVY }, g);
  el('ellipse', { cx: 7, cy: 3, rx: 12.5, ry: 6.8, fill: SKIN }, g);
  return g;
}
function mkHand(parent) {
  const g = el('g', null, parent);
  el('circle', { r: 10.5, fill: NAVY }, g);
  el('circle', { r: 7.5, fill: SKIN }, g);
  return g;
}

/* ===================== CARTOON FIGHTER ===================== */
class Fighter {
  constructor(parent, o, overlay) {
    this.o = o;
    this.root = el('g', null, parent);
    this.shadow = el('ellipse', { cx: 0, cy: 3, rx: 34, ry: 8, fill: '#000', opacity: 0.3 }, this.root);
    this.body = el('g', null, this.root);

    this.legs = [mkLimb(this.body, 22, '#ffffff'), mkLimb(this.body, 22, '#ffffff')];
    this.feet = [mkFoot(this.body), mkFoot(this.body)];

    this.upper = el('g', null, this.body);
    this.armBack = mkLimb(this.upper, 15, '#f4f6ff');
    this.handBack = mkHand(this.upper);

    el('path', {
      d: 'M-21,-146 Q-24,-146 -24,-140 L-22,-100 Q-22,-96 -18,-96 L18,-96 Q22,-96 22,-100 L24,-140 Q24,-146 21,-146 Z',
      fill: '#fff', stroke: NAVY, 'stroke-width': 3, 'stroke-linejoin': 'round'
    }, this.upper);
    el('polyline', { points: '-10,-146 4,-118 14,-146', fill: 'none', stroke: NAVY, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, this.upper);
    el('rect', { x: -23, y: -112, width: 46, height: 10, rx: 3, fill: o.accent, stroke: NAVY, 'stroke-width': 2.5 }, this.upper);
    el('polygon', { points: '8,-102 2,-86 10,-89 15,-102', fill: o.accent, stroke: NAVY, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, this.upper);
    el('rect', { x: 4, y: -115, width: 12, height: 14, rx: 3, fill: o.accent, stroke: NAVY, 'stroke-width': 2.5 }, this.upper);
    if (o.letter) {
      el('circle', { cx: -11, cy: -129, r: 8.5, fill: NAVY }, this.upper);
      const t = el('text', {
        x: 0, y: 0, transform: 'translate(-11 -129)' + (o.mirror ? ' scale(-1 1)' : ''),
        'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 12, 'font-weight': 700, fill: '#fff'
      }, this.upper);
      t.textContent = o.letter;
    }

    this.head = el('g', null, this.upper);
    if (o.hairStyle === 'pony') {
      el('path', { d: 'M-30,-16 C-62,-24 -66,12 -48,34 C-52,14 -44,4 -30,4 Z', fill: o.hair, stroke: NAVY, 'stroke-width': 3, 'stroke-linejoin': 'round' }, this.head);
    }
    if (o.hairStyle === 'bun') {
      el('circle', { cx: -4, cy: -38, r: 14, fill: o.hair, stroke: NAVY, 'stroke-width': 3 }, this.head);
    }
    el('circle', { cx: 0, cy: 0, r: 36, fill: SKIN, stroke: NAVY, 'stroke-width': 3 }, this.head);
    el('circle', { cx: -30, cy: 6, r: 6, fill: SKIN, stroke: NAVY, 'stroke-width': 2.5 }, this.head);
    el('path', {
      d: 'M-36,-2 C-40,-44 40,-48 36,-2 C26,-16 14,-22 4,-14 C-6,-26 -24,-18 -36,-2 Z',
      fill: o.hair, stroke: NAVY, 'stroke-width': 3, 'stroke-linejoin': 'round'
    }, this.head);
    el('polygon', { points: '-34,-8 -56,0 -48,-12 -58,-20 -36,-15', fill: o.accent, stroke: NAVY, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, this.head);
    el('path', { d: 'M-36,-12 Q0,-30 36,-12 L36,-3 Q0,-21 -36,-3 Z', fill: o.accent, stroke: NAVY, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, this.head);
    el('ellipse', { cx: 11, cy: 4, rx: 4.8, ry: 6.4, fill: NAVY }, this.head);
    el('ellipse', { cx: 27, cy: 4, rx: 4.8, ry: 6.4, fill: NAVY }, this.head);
    el('circle', { cx: 9.5, cy: 1.5, r: 1.9, fill: '#fff' }, this.head);
    el('circle', { cx: 25.5, cy: 1.5, r: 1.9, fill: '#fff' }, this.head);
    el('ellipse', { cx: 25, cy: 17, rx: 7, ry: 4, fill: '#ff8fa3', opacity: 0.75 }, this.head);
    this.mouths = [
      el('path', { d: 'M15,18 Q21,24 29,17', fill: 'none', stroke: NAVY, 'stroke-width': 2.8, 'stroke-linecap': 'round' }, this.head),
      (() => {
        const g = el('g', null, this.head);
        el('ellipse', { cx: 22, cy: 20, rx: 7, ry: 8, fill: '#5b1a2a', stroke: NAVY, 'stroke-width': 2.5 }, g);
        el('ellipse', { cx: 22, cy: 24, rx: 4, ry: 3, fill: '#ff6b81' }, g);
        return g;
      })(),
      el('path', { d: 'M14,21 q4,-4 7,0 t7,0', fill: 'none', stroke: NAVY, 'stroke-width': 2.8, 'stroke-linecap': 'round' }, this.head)
    ];
    this.sweat = el('path', { d: 'M-26,-26 C-32,-14 -34,-8 -28,-4 C-22,-8 -22,-14 -26,-26 Z', fill: '#8fd8ff', stroke: NAVY, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, this.head);

    this.armFront = mkLimb(this.upper, 15, '#ffffff');
    this.handFront = mkHand(this.upper);

    // stamina bar lives in the un-mirrored overlay layer so its text is never flipped
    if (o.showBar && overlay) {
      this.barG = el('g', null, overlay);
      el('rect', { x: -32, y: -6, width: 64, height: 12, rx: 6, fill: NAVY, opacity: 0.9 }, this.barG);
      this.barFill = el('rect', { x: -29.5, y: -3.5, width: 59, height: 7, rx: 3.5, fill: '#35d07f' }, this.barG);
      this.barTag = el('text', {
        x: 0, y: -10, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700,
        fill: '#fff', stroke: NAVY, 'stroke-width': 3.5, 'paint-order': 'stroke', 'stroke-linejoin': 'round'
      }, this.barG);
    }
  }

  setBar(s, tag, now) {
    if (!this.barG) return;
    this.barFill.setAttribute('width', Math.max(0.01, 59 * s).toFixed(1));
    const T = CONFIG.TEAM;
    const col = s >= T.GREEN_AT ? '#35d07f' : (s >= T.RED_BELOW ? '#ffc83d' : '#ff4057');
    this.barFill.setAttribute('fill', col);
    this.barG.setAttribute('opacity', (s < T.RED_BELOW ? 0.6 + 0.4 * Math.abs(Math.sin(now / 130)) : 1).toFixed(2));
    if (this.tagTxt !== tag) {
      this.tagTxt = tag;
      this.barTag.textContent = tag || '';
      this.barTag.setAttribute('fill', tag === 'TIRED!' ? '#ffb3bd' : '#fff');
    }
  }

  /* p = { e:[e0,e1], hopY, hopN, stance, lunge, tired, bob, mouth } */
  pose(p) {
    const rest = [-1 - 13 * p.stance, -1 + 13 * p.stance];   // the two legs swap front/back between kicks
    for (let L = 0; L < 2; L++) {
      let a1, a2;
      if (p.legs) { a1 = p.legs[L][0]; a2 = p.legs[L][1]; }
      else {
        const e = p.e[L], tuck = p.hopN * (1 - e);
        a1 = rest[L] + (84 - rest[L]) * e - 12 * tuck;
        a2 = 92 * e * e - 34 * tuck;
      }
      const k = [LEG * Math.sin(a1 * D2R), HIP_Y + LEG * Math.cos(a1 * D2R)];
      const f = [k[0] + LEG * Math.sin(a2 * D2R), k[1] + LEG * Math.cos(a2 * D2R)];
      this.legs[L].set([[0, HIP_Y], k, f]);
      this.feet[L].setAttribute('transform', 'translate(' + f[0].toFixed(1) + ' ' + f[1].toFixed(1) + ') rotate(' + (-a2).toFixed(1) + ')');
    }
    this.body.setAttribute('transform', 'translate(' + (p.lunge * 18).toFixed(1) + ' ' + (-p.hopY - p.bob).toFixed(1) + ')');
    this.shadow.setAttribute('rx', (34 * (1 - 0.3 * p.hopN)).toFixed(1));
    this.shadow.setAttribute('opacity', (0.3 * (1 - 0.4 * p.hopN)).toFixed(2));
    const lean = (p.lean !== undefined ? p.lean : 5 * p.lunge) - 3 * p.tired;
    this.upper.setAttribute('transform', 'rotate(' + lean.toFixed(1) + ' 0 ' + HIP_Y + ')');

    const U0 = [26, 52], F0 = [148, 164];
    const arms = [this.armBack, this.armFront], hands = [this.handBack, this.handFront];
    for (let L = 0; L < 2; L++) {
      const sw = (L === 0 ? 38 : -28) * p.lunge;
      let u = U0[L] + 16 * p.hopN + sw;
      let f = F0[L] + 8 * p.hopN;
      const t = p.tired * 0.6;
      u = u * (1 - t) + 6 * t;
      f = f * (1 - t) + 30 * t;
      const s = [L === 0 ? 0 : 2, SH_Y + 4];
      const el_ = [s[0] + ARM * Math.sin(u * D2R), s[1] + ARM * Math.cos(u * D2R)];
      const h = [el_[0] + ARM * Math.sin(f * D2R), el_[1] + ARM * Math.cos(f * D2R)];
      arms[L].set([s, el_, h]);
      hands[L].setAttribute('transform', 'translate(' + h[0].toFixed(1) + ' ' + h[1].toFixed(1) + ')');
    }

    this.head.setAttribute('transform', 'translate(0 -180) rotate(' + (p.tired * 8).toFixed(1) + ')');
    for (let i = 0; i < 3; i++) this.mouths[i].setAttribute('display', i === p.mouth ? 'inline' : 'none');
    this.sweat.setAttribute('display', p.tired > 0.5 ? 'inline' : 'none');
  }
}

/* ===================== SCENE (hall backdrop + crowd + one or two sides) ===================== */
// Local coordinates of one "side" (holder + pad + fighters). The fighter always faces right;
// the ghost side is mirrored with a transform so it faces left.
const SIDE_X0 = -10, SIDE_W = 540, VB_H = 300, GROUND = 262;
const RING_X = 190, WAIT_X = 60, PAD_X = 336, PAD_Y = GROUND - 90, HOLD_X = 452;
let sceneUid = 0, padUid = 0;

function buildBackdrop(svg, uid, x0, x1) {
  const defs = el('defs', null, svg);
  const sky = el('linearGradient', { id: uid + 'w', gradientUnits: 'userSpaceOnUse', x1: 0, y1: -300, x2: 0, y2: GROUND }, defs);
  el('stop', { offset: 0, 'stop-color': '#5db8ff' }, sky);
  el('stop', { offset: 0.55, 'stop-color': '#a6dbff' }, sky);
  el('stop', { offset: 1, 'stop-color': '#e2f4ff' }, sky);
  const flo = el('linearGradient', { id: uid + 'f', gradientUnits: 'userSpaceOnUse', x1: 0, y1: GROUND, x2: 0, y2: GROUND + 400 }, defs);
  el('stop', { offset: 0, 'stop-color': '#2d2f3a' }, flo);
  el('stop', { offset: 1, 'stop-color': '#0b0c10' }, flo);

  const L = x0 - 700, R = x1 + 700;
  el('rect', { x: L, y: -1500, width: R - L, height: GROUND + 1500, fill: 'url(#' + uid + 'w)' }, svg);
  // a few soft clouds
  for (let x = L + 40, i = 0; x < R; x += 230, i++) {
    const cy = 30 + ((i * 47) % 50), g = el('g', { opacity: 0.85 }, svg);
    el('ellipse', { cx: x, cy: cy, rx: 46, ry: 11, fill: '#fff' }, g);
    el('ellipse', { cx: x + 22, cy: cy - 9, rx: 26, ry: 11, fill: '#fff' }, g);
    el('ellipse', { cx: x - 24, cy: cy - 6, rx: 20, ry: 8, fill: '#fff' }, g);
  }
  // crowd silhouettes: two rows, arms up, bobbing and waving (CSS animation). No flags.
  function figure(x, y, sc, fill, i) {
    const g = el('g', { transform: 'translate(' + x + ' ' + y + ') scale(' + sc + ')' }, svg);
    const b = el('g', { class: 'cb', style: 'animation-duration:' + (0.85 + (i % 5) * 0.09).toFixed(2) + 's;animation-delay:-' + ((i * 0.37) % 1.2).toFixed(2) + 's' }, g);
    el('path', { d: 'M-17,80 Q-17,20 0,17 Q17,20 17,80 Z', fill: fill }, b);
    el('circle', { cx: 0, cy: 0, r: 11.5, fill: fill }, b);
    const aL = el('g', { transform: 'translate(-12 26)' }, b);
    const aLi = el('g', { class: 'al', style: 'animation-delay:-' + ((i * 0.23) % 0.7).toFixed(2) + 's' }, aL);
    el('line', { x1: 0, y1: 0, x2: -7, y2: -30, stroke: fill, 'stroke-width': 7, 'stroke-linecap': 'round' }, aLi);
    const aR = el('g', { transform: 'translate(12 26)' }, b);
    const aRi = el('g', { class: 'ar', style: 'animation-delay:-' + ((i * 0.31) % 0.7).toFixed(2) + 's' }, aR);
    el('line', { x1: 0, y1: 0, x2: 7, y2: -30, stroke: fill, 'stroke-width': 7, 'stroke-linecap': 'round' }, aRi);
  }
  let idx = 0;
  for (let x = L + 20; x < R; x += 38) { figure(x + ((idx * 17) % 11), GROUND - 124, 0.88, '#3b4f9c', idx); idx++; }
  for (let x = L + 4; x < R; x += 42) { figure(x + ((idx * 13) % 9), GROUND - 96, 1.02, '#1f2b6e', idx); idx++; }

  // simple barrier that keeps the audience out of the ring
  const BH = 24;
  el('rect', { x: L, y: GROUND - BH, width: R - L, height: BH, fill: '#f3f6ff' }, svg);
  el('rect', { x: L, y: GROUND - BH, width: R - L, height: 5, fill: '#2f6bff' }, svg);
  el('rect', { x: L, y: GROUND - 3, width: R - L, height: 3, fill: '#1b2250', opacity: 0.35 }, svg);
  for (let x = Math.floor(L / 120) * 120; x <= R; x += 120) el('rect', { x: x - 3, y: GROUND - BH, width: 6, height: BH, fill: '#c9d5f2' }, svg);

  // black foam floor
  el('rect', { x: L, y: GROUND, width: R - L, height: 700, fill: 'url(#' + uid + 'f)' }, svg);
  for (let x = Math.floor(L / 64) * 64; x <= R; x += 64) el('line', { x1: x, y1: GROUND, x2: x, y2: GROUND + 200, stroke: '#5a6080', 'stroke-width': 2, opacity: 0.4 }, svg);
  el('line', { x1: L, y1: GROUND + 24, x2: R, y2: GROUND + 24, stroke: '#5a6080', 'stroke-width': 2, opacity: 0.4 }, svg);
}

class Scene {
  /* cfg = { split:boolean, showScore:boolean, sides:[{ mirror:bool, fighters:[opts], label, color }] } */
  constructor(container, cfg) {
    this.cfg = cfg;
    const uid = 'sc' + (sceneUid++);
    this.div = document.createElement('div');
    this.div.className = 'lane';
    container.appendChild(this.div);

    const W = cfg.split ? SIDE_W * 2 : SIDE_W;
    this.svg = el('svg', { viewBox: SIDE_X0 + ' 0 ' + W + ' ' + VB_H, preserveAspectRatio: 'xMidYMax meet' });
    this.div.appendChild(this.svg);
    buildBackdrop(this.svg, uid, SIDE_X0, SIDE_X0 + W);

    this.overlay = null;
    this.sides = [];
    const sideGroups = cfg.sides.map((sc, i) => {
      const tx = sc.mirror ? 520 : (cfg.split ? 540 : 0);
      const g = el('g', { transform: sc.mirror ? 'translate(' + tx + ' 0) scale(-1 1)' : 'translate(' + tx + ' 0)' }, this.svg);
      return { sc, g, tx };
    });
    this.overlay = el('g', null, this.svg);   // created after sides so it sits on top; sides built below need it
    // build sides (bars go to the overlay, which is already on top because it was appended last)
    sideGroups.forEach(sg => this.sides.push(this.buildSide(sg)));

    // HTML overlays
    this.labels = cfg.sides.map((sc, i) => {
      const d = document.createElement('div');
      d.className = 'laneLabel ' + ((cfg.split && i === 1) ? 'right' : 'left');
      d.style.background = sc.color;
      d.textContent = sc.label;
      this.div.appendChild(d);
      return d;
    });
    if (cfg.showScore) {
      this.scoreEl = document.createElement('div');
      this.scoreEl.className = 'laneScore';
      this.scoreEl.textContent = '0';
      this.div.appendChild(this.scoreEl);
    }
    this.score = 0;
  }

  buildSide(sg) {
    const sc = sg.sc, g = sg.g;
    // kneeling holder, faces left, holds the pad at waist height
    const hg = el('g', { transform: 'translate(' + HOLD_X + ' ' + GROUND + ')' }, g);
    el('ellipse', { cx: 6, cy: 3, rx: 62, ry: 8, fill: '#000', opacity: 0.25 }, hg);
    mkLimb(hg, 22, '#3d4366').set([[10, -12], [64, -12]]);
    mkFoot(hg).setAttribute('transform', 'translate(66 -12) rotate(90) scale(.9)');
    mkLimb(hg, 22, '#3d4366').set([[4, -64], [-32, -64], [-32, -8]]);
    mkFoot(hg).setAttribute('transform', 'translate(-30 -6) scale(-1 1)');
    el('rect', { x: -22, y: -142, width: 44, height: 84, rx: 18, fill: '#dfe5f5', stroke: NAVY, 'stroke-width': 3 }, hg);
    const hh = el('g', { transform: 'translate(-2 -172)' }, hg);
    el('circle', { cx: 0, cy: 0, r: 31, fill: SKIN, stroke: NAVY, 'stroke-width': 3 }, hh);
    el('path', { d: 'M31,-2 C34,-40 -34,-42 -31,-2 C-22,-14 -12,-20 -3,-12 C6,-22 20,-16 31,-2 Z', fill: '#2a2438', stroke: NAVY, 'stroke-width': 3, 'stroke-linejoin': 'round' }, hh);
    el('ellipse', { cx: -10, cy: 4, rx: 4.2, ry: 5.6, fill: NAVY }, hh);
    el('ellipse', { cx: -24, cy: 4, rx: 4.2, ry: 5.6, fill: NAVY }, hh);
    el('circle', { cx: -11.2, cy: 2, r: 1.7, fill: '#fff' }, hh);
    el('circle', { cx: -25.2, cy: 2, r: 1.7, fill: '#fff' }, hh);
    el('ellipse', { cx: -22, cy: 15, rx: 6, ry: 3.6, fill: '#ff8fa3', opacity: 0.75 }, hh);
    el('path', { d: 'M-27,16 Q-21,22 -13,15', fill: 'none', stroke: NAVY, 'stroke-width': 2.6, 'stroke-linecap': 'round' }, hh);

    // fighters
    const fighters = sc.fighters.map(fo => new Fighter(g, Object.assign({ mirror: sc.mirror }, fo), this.overlay));
    const vs = sc.fighters.map((_, i) => ({
      t0: [-1e9, -1e9], D: 0.16, lastK: -1e9, interval: 0.15, legSel: 0,
      y: 0, vy: 0, grav: 12000, st: 1, stT: 1,
      posT: i === 0 ? 1 : 0, tired: 0, e: [0, 0],
      // shuffle-kick cycle (Team series)
      th: 0, cyc0: 0, Dc: 0.25, active: false, pending: 0, armed: false, idleSince: -1e9, c: 0, ivl: 0.3
    }));

    // holder's arms reach the top of the pad (drawn first, so the pad and hands sit on top)
    const pa = el('g', null, g);
    pa.setAttribute('transform', 'translate(' + PAD_X + ' ' + PAD_Y + ')');
    mkLimb(pa, 14, SKIN).set([[108, -34], [74, -12], [32, -38]]);
    mkLimb(pa, 14, SKIN).set([[104, -38], [66, -24], [12, -40]]);
    // kicking pad: held by the TOP, hanging flat, strike face (blue) pointing down
    const padG = el('g', { transform: 'translate(' + PAD_X + ' ' + PAD_Y + ')' }, g);
    const pg = el('g', { transform: 'rotate(-8)' }, padG);
    const cid = 'pc' + (padUid++);
    const cp = el('clipPath', { id: cid }, pg);
    el('rect', { x: -42, y: -38, width: 84, height: 38, rx: 7 }, cp);

    el('rect', { x: -42, y: -38, width: 84, height: 38, fill: '#14161c' }, pc);

    el('rect', { x: -42, y: -6, width: 84, height: 6, fill: '#2a52e8' }, pc);      // blue striking face underneath
    el('rect', { x: -42, y: -6.6, width: 84, height: 1.2, fill: '#0a0c12' }, pc);
    el('rect', { x: -42, y: -38, width: 84, height: 38, rx: 7, fill: 'none', stroke: '#0a0b10', 'stroke-width': 3 }, pg);
    const h1 = mkHand(padG); h1.setAttribute('transform', 'translate(12 -41)');
    const h2 = mkHand(padG); h2.setAttribute('transform', 'translate(32 -39)');

    // impact star
    const star = el('g', { opacity: 0 }, g);
    const pts = [];
    for (let i = 0; i < 16; i++) {
      const r = i % 2 ? 11 : 26, a = i * Math.PI / 8;
      pts.push((Math.cos(a) * r).toFixed(1) + ',' + (Math.sin(a) * r).toFixed(1));
    }
    el('polygon', { points: pts.join(' '), fill: '#ffd23f', stroke: NAVY, 'stroke-width': 3, 'stroke-linejoin': 'round' }, star);
    el('circle', { r: 7, fill: '#fff' }, star);

    return { sc, g, tx: sg.tx, mir: !!sc.mirror, fighters, vs, hg, padG, star, lastImpact: -1e9, starRot: 0 };
  }

  setScore(n) {
    if (this.scoreEl && n !== this.score) { this.score = n; this.scoreEl.textContent = n; }
  }

  // stam = that fighter's stamina right now (1 for the Individual series)
  kick(si, fi, now, stam) {
    const s = this.sides[si], v = s.vs[fi];
    if (this.cfg.cycle) { this.kickCycle(s, v, now); return; }
    const interval = clamp((now - v.lastK) / 1000, 0.05, 0.5);
    v.interval = v.interval * 0.5 + interval * 0.5;
    v.lastK = now;
    v.legSel = 1 - v.legSel;
    v.t0[v.legSel] = now;
    v.D = clamp(v.interval * 1.05, 0.10, 0.22);
    v.stT = v.legSel ? -1 : 1;                   // legs exchange front/back after each kick
    // shuffle hop: full height when fresh, smaller when tired, none at red (plain front kick)
    const T = CONFIG.TEAM;
    let peak = 14;
    if (stam < T.RED_BELOW) peak = 0;
    else if (stam < T.GREEN_AT) peak = 7 + 7 * ((stam - T.RED_BELOW) / (T.GREEN_AT - T.RED_BELOW));
    if (peak > 0) {
      const air = clamp(v.interval * 0.85, 0.07, 0.17);
      v.vy = 4 * peak / air;
      v.grav = 8 * peak / (air * air);
    }
    s.lastImpact = now;
    s.starRot += 37;
  }

  // Team series: a kick request is queued; the fighter performs one full shuffle-kick cycle per kick
  kickCycle(s, v, now) {
    const gap = clamp((now - v.lastK) / 1000, 0.05, 0.8);
    v.ivl = v.ivl * 0.5 + gap * 0.5;
    v.lastK = now;
    if (v.active) v.pending = Math.min(2, v.pending + 1);
    else { v.pending = 1; }
  }

  render(now, dt, states) {
    for (let si = 0; si < this.sides.length; si++) {
      const s = this.sides[si], st = states[si];
      const n = s.fighters.length;
      for (let i = 0; i < n; i++) {
        const f = s.fighters[i], v = s.vs[i];
        const isRing = (n === 1) || st.ring === i;

        // trade places on swap (0.5 s)
        const target = isRing ? 1 : 0, d = target - v.posT, step = dt * 2;
        v.posT += Math.abs(d) <= step ? d : Math.sign(d) * step;
        const ps = v.posT * v.posT * (3 - 2 * v.posT);
        const x = WAIT_X + (RING_X - WAIT_X) * ps;
        const sc = 0.85 + 0.15 * ps;
        const arc = -Math.sin(Math.PI * v.posT) * 18;
        f.root.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + (GROUND + arc).toFixed(1) + ') scale(' + sc.toFixed(3) + ')');

        const stam = st.stamina ? st.stamina[i] : 1;
        const tiredT = (st.stamina && stam < CONFIG.TEAM.RED_BELOW) ? 1 : 0;
        v.tired += (tiredT - v.tired) * (1 - Math.exp(-dt * 6));
        const since = (now - v.lastK);

        if (this.cfg.cycle && isRing) {
          /* ---------- shuffle-kick cycle ---------- */
          const T = CONFIG.TEAM;
          const hopS = (() => { const lo = T.RED_BELOW / 2; const u = clamp((stam - lo) / (T.GREEN_AT - lo), 0, 1); return u * u * (3 - 2 * u); })();   // green full hop, yellow smaller, no hop from the middle of red
          const startCycle = () => {
            v.pending--;
            v.cyc0 = Math.round(v.th);
            v.th = v.cyc0;
            v.Dc = Math.max(1 / rateFor(stam), Math.min(v.ivl, 0.4));
            v.active = true; v.armed = true;
          };
          if (!v.active && v.pending > 0) startCycle();
          if (v.active) {
            v.th += dt / v.Dc;
            if (v.armed && v.th - v.cyc0 >= 0.3) {            // the foot reaches the pad
              v.armed = false;
              s.lastImpact = now; s.starRot += 37;
              if (s.sc.sound) Snd.kick(s.sc.sound === 'ghost' ? { gain: 0.6, rate: 0.88 } : null);
            }
            if (v.th - v.cyc0 >= 1) {
              v.th = v.cyc0 + 1;
              v.active = false; v.idleSince = now;
              if (v.pending > 0) startCycle();
            }
          }
          const u = v.active ? clamp(v.th - v.cyc0, 0, 1) : 0;
          const wantC = (v.active || v.pending > 0 || now - v.idleSince < 250) ? 1 : 0;
          v.c += (wantC - v.c) * (1 - Math.exp(-dt * 14));
          const boost = clamp((stam - 0.5) / 0.1, 0, 1);       // extra height only in the green zone (yellow and red stay as they were)
          const hopH = (10 * hopS + 9 * boost) * Math.sin(Math.PI * clamp(u / 0.7, 0, 1));
          const legs = [legKF(((v.th % 2) + 2) % 2, v.c, hopS), legKF((((v.th - 1) % 2) + 2) % 2, v.c, hopS)];
          const ext = clamp(Math.max(legs[0][1], legs[1][1]) / 92, 0, 1);
          const idle = !v.active;
          const bounce = idle ? Math.abs(Math.sin(now / (v.tired > 0.5 ? 380 : 190) + i * 1.7)) * (v.tired > 0.5 ? 2 : 4) : 0;
          const mouth = (since < 160) ? 1 : (v.tired > 0.5 ? 2 : 0);
          f.pose({ legs: legs, hopY: hopH, hopN: clamp(hopH / 14, 0, 1), stance: 0, lunge: ext, lean: -4 * ext, tired: v.tired, bob: bounce, mouth: mouth, e: [0, 0] });
        } else {
          // smooth kick curves (continuous, not frame-by-frame)
          if (this.cfg.cycle) { v.active = false; v.pending = 0; v.c = 0; v.th = Math.round(v.th); }
          v.e[0] = isRing ? pulse((now - v.t0[0]) / 1000 / v.D) : 0;
          v.e[1] = isRing ? pulse((now - v.t0[1]) / 1000 / v.D) : 0;
          v.st += (v.stT - v.st) * (1 - Math.exp(-dt * 16));
          if (v.y > 0 || v.vy > 0) {
            v.vy -= v.grav * dt;
            v.y += v.vy * dt;
            if (v.y <= 0) { v.y = 0; v.vy = 0; }
          }
          const hopN = clamp(v.y / 14, 0, 1.2);
          const lunge = Math.max(v.e[0], v.e[1]);
          const bounce = Math.abs(Math.sin(now / (v.tired > 0.5 ? 380 : 190) + i * 1.7)) * (v.tired > 0.5 ? 2 : 5);
          const bob = bounce * clamp(1 - hopN * 3, 0, 1) * (since > 250 ? 1 : 0.3);
          const mouth = (isRing && since < 130) ? 1 : (v.tired > 0.5 ? 2 : 0);
          f.pose({ e: v.e, hopY: v.y, hopN: hopN, stance: v.st, lunge: lunge, tired: v.tired, bob: bob, mouth: mouth });
        }

        if (f.barG) {
          const gx = s.mir ? s.tx - x : s.tx + x;
          f.barG.setAttribute('transform', 'translate(' + gx.toFixed(1) + ' ' + (GROUND + arc - 244 * sc).toFixed(1) + ')');
          let tag = '';
          if (isRing && stam < CONFIG.TEAM.RED_BELOW) tag = 'TIRED!';
          else if (!isRing && stam >= 0.7) tag = 'READY!';
          f.setBar(stam, tag, now);
        }
      }
      // pad + holder + star react to the kick
      const sq = Math.max(0, 1 - (now - s.lastImpact) / 120);
      s.padG.setAttribute('transform', 'translate(' + (PAD_X + sq * 6).toFixed(1) + ' ' + (PAD_Y - sq * 5).toFixed(1) + ') scale(' + (1 + 0.03 * sq).toFixed(3) + ' ' + (1 - 0.08 * sq).toFixed(3) + ')');
      s.hg.setAttribute('transform', 'translate(' + (HOLD_X + sq * 5).toFixed(1) + ' ' + GROUND + ')');
      s.star.setAttribute('opacity', sq.toFixed(2));
      s.star.setAttribute('transform', 'translate(' + (PAD_X - 34) + ' ' + (PAD_Y + 6) + ') rotate(' + s.starRot + ') scale(' + (0.5 + 0.8 * sq).toFixed(2) + ')');
      if (this.scoreEl && si === 0) this.scoreEl.style.transform = 'scale(' + (1 + 0.18 * sq).toFixed(3) + ')';
    }
  }
}

/* ===================== SOUND ===================== */
const Snd = {
  ctx: null, master: null, muted: false, buf: {}, noise: null, voices: 0, loading: false,
  ensure() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -10; comp.knee.value = 8; comp.ratio.value = 8;
        comp.attack.value = 0.002; comp.release.value = 0.12;
        this.master = this.ctx.createGain();
        this.master.gain.value = CONFIG.MASTER_VOLUME;
        this.master.connect(comp); comp.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
    if (this.ctx && !this.loading) { this.loading = true; this.load(); }
  },
  b64ToBuf(b64) {
    const bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8.buffer;
  },
  load() {
    Object.keys(ASSETS.sounds).forEach(name => {
      try {
        const ab = this.b64ToBuf(ASSETS.sounds[name]);
        const ok = b => { this.buf[name] = b; };
        const p = this.ctx.decodeAudioData(ab, ok, () => {});
        if (p && p.then) p.then(ok).catch(() => {});
      } catch (e) {}
    });
  },
  play(name, o) {
    if (this.muted || !this.ctx || !this.buf[name]) return false;
    try {
      const src = this.ctx.createBufferSource(), g = this.ctx.createGain();
      src.buffer = this.buf[name];
      src.playbackRate.value = (o && o.rate) || 1;
      g.gain.value = (o && o.gain) || 1;
      src.connect(g); g.connect(this.master);
      src.start();
      this.voices++;
      src.onended = () => { this.voices--; };
      return true;
    } catch (e) { return false; }
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (this.muted || !this.ctx) return;
    try {
      const c = this.ctx, t = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  },
  kick(o) {
    if (this.voices > 14) return;
    o = o || {};
    if (!this.play('kick', { rate: (o.rate || 1) * (0.94 + Math.random() * 0.16), gain: o.gain || 1 })) {
      this.tone(230, 0.07, 'triangle', 0.5, 70); this.tone(1000, 0.035, 'square', 0.08, 350);
    }
  },
  start() { if (!this.play('start', { gain: 1 })) this.tone(990, 0.35, 'sine', 0.5); },
  end() { if (!this.play('dang', { gain: 1 })) { this.tone(523, 0.18, 'sine', 0.4); this.tone(659, 0.18, 'sine', 0.4, 0, 0.18); this.tone(784, 0.32, 'sine', 0.4, 0, 0.36); } },
  bling(i) {
    const f = 1318 * Math.pow(1.122, Math.min(i || 0, 8));
    this.tone(f, 0.16, 'sine', 0.35);
    this.tone(f * 2, 0.22, 'sine', 0.18, 0, 0.012);
    this.tone(f * 3, 0.12, 'sine', 0.08, 0, 0.02);
  },
  beep() { this.tone(660, 0.14, 'sine', 0.45); },
  swap() { this.tone(450, 0.09, 'sine', 0.3, 900); },
};

function tutMark(m) { try { localStorage.setItem('mt_speedkicks_tut_' + m, '1'); } catch (e) {} }
function unionRect(list) {
  let l = 1e9, t = 1e9, r = -1e9, b = -1e9;
  list.forEach(e => { if (!e) return; const q = e.getBoundingClientRect(); if (!q.width) return; l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom); });
  return l > r ? null : { left: l, top: t, width: r - l, height: b - t };
}

    if (r.height > vh * 0.45) {            // tall target (landscape KICK button): put the note beside it
      tip.style.left = Math.max(12, r.left - w - 16) + 'px';
      tip.style.top = clamp(r.top + r.height / 2 - 40, 10, vh - 120) + 'px';
    } else if (r.top + r.height / 2 > vh * 0.5) tip.style.bottom = (vh - r.top + 18) + 'px';
    else tip.style.top = (r.top + r.height + 18) + 'px';
  }
  tut.classList.remove('hidden');
  tut.onpointerdown = e => { e.preventDefault(); i++; show(); };
  $('tutSkip').onpointerdown = e => { e.preventDefault(); e.stopPropagation(); i = steps.length; show(); };
  show();
}

// state: menu | ready | countdown | playing | paused | resuming | finished
let state = 'menu';
let mode = null;               // 'individual' | 'team'
let runToken = 0, raf = 0, lastFrame = 0, roundStart = 0, pauseStart = 0;
let me = null, ghostModel = null, bot = null, scenes = [], myScene = null, ghostScene = null;
let gradeLabels = [], gradeLast = '';
let freezeAt = 0;             // team scene hangs still at this moment while paused or after the bell

const BEST_KEY = 'mt_speedkicks_best_individual_20s';
function loadBest() { try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }
function roundSecs() { return mode === 'team' ? CONFIG.TEAM_SECONDS : CONFIG.INDIVIDUAL_SECONDS; }
function gradeFor(k) {
  for (const g of CONFIG.GRADES) if (k >= g.min) return g;
  return CONFIG.GRADES[CONFIG.GRADES.length - 1];
}

const FIGHTERS_ME = [
  { hair: '#1d1d33', hairStyle: 'none', accent: '#2f6bff', letter: 'A', showBar: true },
  { hair: '#4a2a14', hairStyle: 'bun', accent: '#2f6bff', letter: 'B', showBar: true }
];
const FIGHTERS_GHOST = [
  { hair: '#e8872a', hairStyle: 'none', accent: '#ff4057', letter: 'A', showBar: true },
  { hair: '#7a3b1d', hairStyle: 'pony', accent: '#ff4057', letter: 'B', showBar: true }
];

/* ---------- scenes ---------- */
function buildScenes() {
  dom.lanes.innerHTML = '';
  scenes = []; myScene = null; ghostScene = null;
  if (mode === 'individual') {
    myScene = new Scene(dom.lanes, {
      split: false, showScore: true,
      sides: [{ mirror: false, sound: false, label: 'YOU', color: '#2f6bff', fighters: [{ hair: '#1d1d33', hairStyle: 'none', accent: '#2f6bff', letter: '', showBar: false }] }]
    });
    scenes = [myScene];
  } else if (landscapeMQ.matches) {
    // landscape: both teams in ONE scene, ghost on the left (facing left), you on the right (facing right)
    const sc = new Scene(dom.lanes, {
      split: true, showScore: false, cycle: true,
      sides: [
        { mirror: true, sound: 'ghost', label: 'GHOST TEAM', color: '#ff4057', fighters: FIGHTERS_GHOST },
        { mirror: false, sound: true, label: 'YOUR TEAM', color: '#2f6bff', fighters: FIGHTERS_ME }
      ]
    });
    scenes = [sc]; ghostScene = { scene: sc, side: 0 }; myScene = { scene: sc, side: 1 };
  } else {
    // portrait: two stacked lanes, ghost on top facing left, you below facing right
    const g = new Scene(dom.lanes, { split: false, showScore: false, cycle: true, sides: [{ mirror: true, sound: 'ghost', label: 'GHOST TEAM', color: '#ff4057', fighters: FIGHTERS_GHOST }] });
    const m = new Scene(dom.lanes, { split: false, showScore: false, cycle: true, sides: [{ mirror: false, sound: true, label: 'YOUR TEAM', color: '#2f6bff', fighters: FIGHTERS_ME }] });
    scenes = [g, m]; ghostScene = { scene: g, side: 0 }; myScene = { scene: m, side: 0 };
  }
}
function sceneKick(ref, fi, now, stam) {
  if (mode === 'individual') myScene.kick(0, fi, now, stam);
  else ref.scene.kick(ref.side, fi, now, stam);
}
landscapeMQ.addEventListener && landscapeMQ.addEventListener('change', () => {
  if (mode === 'team' && !dom.game.classList.contains('hidden')) buildScenes();
});

/* ---------- screens ---------- */
function showMenu() {
  runToken++;
  state = 'menu';
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  dom.overlay.classList.add('hidden');
  $('tut').classList.add('hidden');
  dom.countdown.classList.add('hidden');
  dom.game.classList.add('hidden');
  dom.menu.classList.remove('hidden');
}

function startMode(m) {
  runToken++;
  mode = m;
  dom.menu.classList.add('hidden');
  dom.game.classList.remove('hidden');
  dom.countdown.classList.add('hidden');
  dom.timer.textContent = roundSecs();
  dom.timer.classList.remove('low', 'panic');

  if (m === 'individual') {
    dom.modeTag.textContent = 'Individual Series';
    dom.btnSwap.classList.add('hidden');
    dom.hudGhost.classList.add('hidden'); dom.hudMe.classList.add('hidden');
    me = new IndividualModel(CONFIG);
    ghostModel = null; bot = null;
    buildScenes();
    buildGradeBar();
    dom.gradeBar.classList.remove('hidden');
  } else {
    dom.modeTag.textContent = 'Team Series';
    dom.btnSwap.classList.remove('hidden');
    dom.gradeBar.classList.add('hidden');
    dom.hudGhost.classList.remove('hidden'); dom.hudMe.classList.remove('hidden');
    dom.hudGhostN.textContent = '0'; dom.hudMeN.textContent = '0';
    me = new TeamModel(CONFIG);
    ghostModel = new TeamModel(CONFIG);
    bot = null;
    buildScenes();
  }

  state = 'ready';
  if (!tutSeen(m)) runTutorial(m, showReady); else showReady();
  if (!raf) { lastFrame = performance.now(); raf = requestAnimationFrame(frame); }
}

/* ---------- overlays ---------- */
function showReady() {
  let html;
  if (mode === 'individual') {
    const chips = CONFIG.GRADES.map(g =>
      '<span style="background:' + g.color + '">' + g.name + (g.min ? ' · ' + g.min : '') + '</span>').join('');
    html = '<div class="card"><h2>Individual Series</h2>' +
      '<p>Kick as many times as you can in <b>' + CONFIG.INDIVIDUAL_SECONDS + ' seconds</b>! Your kicks decide your grade.</p>' +
      '<div class="gradeList">' + chips + '</div>' +
      '<p>Tap anywhere on the screen, or press <b>Space</b>.</p>' +
      '<div class="row"><button class="btn white" id="ovBack">Back</button><button class="btn" id="ovStart">START!</button></div><button class="qBtn" id="ovHelp" aria-label="How to play">?</button></div>';
  } else {
    html = '<div class="card"><h2>Team Series</h2>' +
      '<p>You have <b>2 fighters</b>. Kicking drains stamina, and a tired fighter kicks slower. Hit <b>SWAP</b> (or press S) to send in your teammate. Swapping takes half a second!</p>' +
      '<p>Beat the ghost team in <b>' + CONFIG.TEAM_SECONDS + ' seconds</b>. You will not know how strong they are until the bell!</p>' +
      '<div class="row"><button class="btn white" id="ovBack">Back</button><button class="btn" id="ovStart">START!</button></div><button class="qBtn" id="ovHelp" aria-label="How to play">?</button></div>';
  }
  dom.overlay.innerHTML = html;
  dom.overlay.classList.remove('hidden');
  $('ovBack').onclick = showMenu;
  $('ovHelp').onclick = () => runTutorial(mode, showReady);
  $('ovStart').onclick = () => { Snd.ensure(); beginCountdown(); };
}

function showCount(txt) {
  dom.countdown.classList.remove('hidden');
  dom.countdown.innerHTML = '<span>' + txt + '</span>';
}

function beginCountdown() {
  const token = ++runToken;
  state = 'countdown';
  dom.overlay.classList.add('hidden');
  if (mode === 'team') {
    const lvl = CONFIG.GHOST_LEVELS[Math.floor(Math.random() * CONFIG.GHOST_LEVELS.length)];
    bot = new GhostBot(ghostModel, lvl.tapsPerSec, (ring, t) => sceneKick(ghostScene, ring, t, ghostModel.stamina[ring]));
  }
  showCount('3'); Snd.beep();
  setTimeout(() => { if (token === runToken) { showCount('2'); Snd.beep(); } }, 900);
  setTimeout(() => { if (token === runToken) { showCount('1'); Snd.beep(); } }, 1800);
  setTimeout(() => { if (token === runToken) { showCount('KICK!'); Snd.start(); startRound(); } }, 2700);
  setTimeout(() => { if (token === runToken) dom.countdown.classList.add('hidden'); }, 3400);
}

function startRound() {
  state = 'playing';
  roundStart = performance.now();
  if (bot) bot.start(roundStart);
}

function finishRound() {
  freezeAt = performance.now();
  state = 'finished';
  const token = ++runToken;
  dom.timer.textContent = '0';
  dom.timer.classList.remove('panic');
  dom.btnSwap.classList.remove('pulse');
  showCount('TIME!');
  Snd.end();
  setTimeout(() => { if (token === runToken) showResult(); }, 1300);
}

function showResult() {
  dom.countdown.classList.add('hidden');
  let html, dia, win = false;
  if (mode === 'individual') {
    const k = me.kicks, g = gradeFor(k);
    const prevBest = loadBest();
    const isBest = k > prevBest;
    if (isBest) saveBest(k);
    dia = g.diamonds;
    html = '<div class="card"><h2>Time\'s up!</h2>' +
      '<div class="gradeBig" style="color:' + g.color + '">' + g.name + '</div>' +
      (isBest ? '<p class="newBest">New record!</p>' : '<p>Record: <b>' + prevBest + '</b></p>') +
      '<div class="twoStat">' +
        '<div class="box"><b>' + k + '</b><span>kicks</span></div>' +
        '<div class="box"><b>' + (k / CONFIG.INDIVIDUAL_SECONDS).toFixed(1) + '</b><span>kicks/s</span><small>kicks per second</small></div>' +
      '</div>' +
      '<div class="diaRow" id="gemSrc">' + gemSVG(40) + '<span>' + dia + '</span></div>' +
      '<div class="row"><button class="btn white" id="ovMenu">Menu</button><button class="btn" id="ovAgain">Play again</button></div></div>';
  } else {
    const a = me.total, b = ghostModel.total;
    const res = a > b ? 'win' : (a < b ? 'lose' : 'draw');
    win = res === 'win';
    dia = CONFIG.TEAM_DIAMONDS[res];
    const title = res === 'win' ? 'YOU WIN!' : (res === 'lose' ? 'GHOST TEAM WINS' : 'DRAW');
    const sum = a + b, myPct = sum ? a / sum * 100 : 50;
    const secs = CONFIG.TEAM_SECONDS;
    html = '<div class="card"><h2>Time\'s up!</h2>' +
      '<div class="faceWrap ' + res + '">' + faceSVG(res) + '</div>' +
      '<div class="banner ' + res + '">' + title + '</div>' +
      '<div class="vsBar"><i class="r" id="barR" style="width:50%"></i><i class="b" id="barB" style="width:50%"></i></div>' +
      '<div class="vsNums"><span class="l">' + b + '</span><span class="rr">' + a + '</span></div>' +
      '<div class="twoStat">' +
        '<div class="box red sm"><b>' + (b / secs).toFixed(1) + '</b><span>kicks/s</span></div>' +
        '<div class="box blue sm"><b>' + (a / secs).toFixed(1) + '</b><span>kicks/s</span></div>' +
      '</div>' +
      '<div class="diaRow" id="gemSrc">' + gemSVG(40) + '<span>' + dia + '</span></div>' +
      '<div class="row"><button class="btn white" id="ovMenu">Menu</button><button class="btn" id="ovAgain">Play again</button></div></div>';
    setTimeout(() => {
      const r = $('barR'), bb = $('barB');
      if (r && bb) { r.style.width = (100 - myPct) + '%'; bb.style.width = myPct + '%'; }
    }, 150);
  }
  dom.overlay.innerHTML = html;
  dom.overlay.classList.remove('hidden');
  $('ovMenu').onclick = showMenu;
  $('ovAgain').onclick = () => { removeGemCtr(); startMode(mode); };
  $('ovMenu').addEventListener('click', removeGemCtr);
  const ctr = document.createElement('div');
  ctr.className = 'gemCtr'; ctr.id = 'gemCtr';
  ctr.innerHTML = gemSVG(26) + '<span id="gemN">' + diamondsTotal + '</span>';
  document.body.appendChild(ctr);
  if (win) confetti();
  flyGems(dia);
}
function removeGemCtr() { const c = $('gemCtr'); if (c) c.remove(); }

/* ---------- pause / resume ---------- */
function pauseGame() {
  if (state !== 'playing') return;
  freezeAt = performance.now();
  state = 'paused';
  pauseStart = performance.now();
  runToken++;
  dom.overlay.innerHTML = '<div class="card"><h2>Paused</h2><p>Take a breather!</p>' +
    '<div class="row col"><button class="btn" id="ovResume">Resume</button><button class="btn white" id="ovMenu">Main Menu</button></div></div>';
  dom.overlay.classList.remove('hidden');
  $('ovResume').onclick = resumeGame;
  $('ovMenu').onclick = showMenu;
}
function resumeGame() {
  if (state !== 'paused') return;
  Snd.ensure();
  const token = ++runToken;
  state = 'resuming';
  dom.overlay.classList.add('hidden');
  showCount('3'); Snd.beep();
  setTimeout(() => { if (token === runToken) { showCount('2'); Snd.beep(); } }, 800);
  setTimeout(() => { if (token === runToken) { showCount('1'); Snd.beep(); } }, 1600);
  setTimeout(() => {
    if (token !== runToken) return;
    const gap = performance.now() - pauseStart;
    roundStart += gap;
    if (bot) bot.shift(gap);
    dom.countdown.classList.add('hidden');
    state = 'playing';
  }, 2400);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ---------- grade bar (individual): D on the far left ... S+ on the far right, no words ---------- */
function gradeAsc() { return CONFIG.GRADES.slice().reverse(); }   // D, C, B, A, S, S+
function buildGradeBar() {
  const asc = gradeAsc(), n = asc.length - 1;
  dom.gradeBar.querySelectorAll('.gtick,.glabel').forEach(x => x.remove());
  gradeLabels = asc.map((g, i) => {
    const pos = i / n * 100;
    if (i > 0 && i < n) {
      const t = document.createElement('div');
      t.className = 'gtick'; t.style.left = pos + '%';
      dom.gTrack.appendChild(t);
    }
    const l = document.createElement('div');
    l.className = 'glabel' + (i === 0 ? ' first' : (i === n ? ' last' : ''));
    l.style.left = pos + '%';
    l.style.background = g.color;
    l.textContent = g.name;
    dom.gradeBar.appendChild(l);
    return l;
  });
  gradeLast = '';
  updateGradeBar(0);
}
function updateGradeBar(k) {
  const asc = gradeAsc(), n = asc.length - 1;
  let pos = 1;
  if (k < asc[n].min) {
    let i = 0;
    while (i < n - 1 && k >= asc[i + 1].min) i++;
    pos = (i + (k - asc[i].min) / (asc[i + 1].min - asc[i].min)) / n;
  }
  dom.gFill.style.width = (pos * 100).toFixed(1) + '%';
  const g = gradeFor(k);
  if (g.name !== gradeLast) {
    gradeLast = g.name;
    dom.gFill.style.background = g.color;
    const reached = asc.indexOf(g);
    gradeLabels.forEach((l, i) => l.classList.toggle('on', i <= reached));
  }
}

/* ---------- input ---------- */
function onKickInput() {
  if (state !== 'playing') return;
  const now = performance.now();
  if (mode === 'individual') {
    if (me.tap(now)) { myScene.kick(0, 0, now, 1); Snd.kick(); }
  } else {
    const ring = me.ring, stam = me.stamina[ring];
    if (me.tap(now)) sceneKick(myScene, ring, now, stam);     // the kick sound plays when the foot hits the pad
  }
}
function onSwapInput() {
  if (state !== 'playing' || mode !== 'team') return;
  if (me.swap(performance.now())) Snd.swap();
}

dom.game.addEventListener('pointerdown', e => {
  Snd.ensure();
  if (state !== 'playing') return;
  if (e.target.closest('.top, #btnSwap, .overlay')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  onKickInput();
});
document.addEventListener('pointerdown', () => Snd.ensure(), { once: true });
dom.btnSwap.addEventListener('pointerdown', e => { e.preventDefault(); onSwapInput(); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (state === 'playing') {
    if (e.code === 'Space') { e.preventDefault(); onKickInput(); }
    else if (e.code === 'KeyS') { e.preventDefault(); onSwapInput(); }
    else if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); pauseGame(); }
  } else if (state === 'paused' && (e.code === 'Escape' || e.code === 'KeyP')) {
    e.preventDefault(); resumeGame();
  }
});
dom.game.addEventListener('contextmenu', e => e.preventDefault());

$('btnIndividual').onclick = () => { Snd.ensure(); startMode('individual'); };
$('btnTeam').onclick = () => { Snd.ensure(); startMode('team'); };
$('btnPause').onclick = () => {
  if (state === 'playing') pauseGame();
  else if (state === 'ready' || state === 'finished') showMenu();
};
$('btnSound').onclick = () => {
  Snd.muted = !Snd.muted;
  $('btnSound').innerHTML = Snd.muted ? SPK_OFF : SPK_ON;
  Snd.ensure();
};

/* ---------- main loop ---------- */
function frame() {
  raf = requestAnimationFrame(frame);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (!mode) return;

  const total = roundSecs();
  let remaining = total;
  if (state === 'playing') {
    remaining = Math.max(0, total - (now - roundStart) / 1000);
    if (mode === 'team') {
      me.update(now, dt);
      if (bot) bot.update(now);
      ghostModel.update(now, dt);
    }
    dom.timer.textContent = Math.ceil(remaining);
    dom.timer.classList.toggle('low', remaining <= CONFIG.RED_TIMER_LAST_SECONDS);
    dom.timer.classList.toggle('panic', remaining <= 5);
  } else if (state === 'paused' || state === 'resuming') {
    remaining = Math.max(0, total - (pauseStart - roundStart) / 1000);
  }

  if (mode === 'individual') {
    myScene.setScore(me.kicks);
    myScene.render(now, dt, [{ stamina: null, ring: 0 }]);
    updateGradeBar(me.kicks);
  } else {
    dom.hudMeN.textContent = me.total;
    dom.hudGhostN.textContent = ghostModel.total;
    const myState = { stamina: me.stamina, ring: me.ring };
    const gState = { stamina: ghostModel.stamina, ring: ghostModel.ring };
    const frozen = state === 'paused' || state === 'resuming' || state === 'finished';
    const rn = frozen ? freezeAt : now, rd = frozen ? 0 : dt;
    if (landscapeMQ.matches) scenes[0].render(rn, rd, [gState, myState]);
    else { scenes[0].render(rn, rd, [gState]); scenes[1].render(rn, rd, [myState]); }
    const hint = state === 'playing' && me.stamina[me.ring] < 0.3 && me.stamina[1 - me.ring] > 0.5;
    dom.btnSwap.classList.toggle('pulse', hint);
  }

  if (state === 'playing' && remaining <= 0) finishRound();
}
